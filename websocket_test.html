<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket 通知系统测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 10px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            background: #f5f5f5;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #e74c3c;
            animation: pulse 2s infinite;
        }

        .status-dot.connected {
            background: #2ecc71;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .controls {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-secondary {
            background: #e74c3c;
            color: white;
        }

        .btn-secondary:hover {
            background: #c0392b;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .notifications {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-height: 500px;
            overflow-y: auto;
        }

        .notifications h3 {
            margin-bottom: 15px;
            color: #333;
        }

        .notification {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .notification:hover {
            background: #e9ecef;
            transform: translateX(5px);
        }

        .notification.payment {
            border-left-color: #2ecc71;
        }

        .notification.order {
            border-left-color: #3498db;
        }

        .notification.delivery {
            border-left-color: #f39c12;
        }

        .notification.system {
            border-left-color: #e74c3c;
        }

        .notification-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .notification-title {
            font-weight: 600;
            color: #333;
            font-size: 16px;
        }

        .notification-time {
            color: #999;
            font-size: 12px;
        }

        .notification-content {
            color: #666;
            line-height: 1.5;
        }

        .notification-type {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 12px;
            color: white;
            margin-top: 5px;
        }

        .empty {
            text-align: center;
            color: #999;
            padding: 40px 0;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔔 WebSocket 通知系统测试</h1>
            <p>顺丰速递实时通知系统 v1.0</p>
            <div class="status">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">未连接</span>
                <span style="margin-left: auto; color: #666;">在线用户: <strong id="onlineCount">0</strong></span>
            </div>
        </div>

        <div class="controls">
            <div class="input-group">
                <label for="userID">用户ID:</label>
                <input type="text" id="userID" placeholder="请输入用户ID" value="user123">
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn btn-primary" id="connectBtn" onclick="connect()">连接</button>
                <button class="btn btn-secondary" id="disconnectBtn" onclick="disconnect()" disabled>断开</button>
                <button class="btn btn-primary" onclick="clearMessages()">清空消息</button>
            </div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="totalMessages">0</div>
                <div class="stat-label">收到消息</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="paymentCount">0</div>
                <div class="stat-label">支付通知</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="orderCount">0</div>
                <div class="stat-label">订单通知</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="deliveryCount">0</div>
                <div class="stat-label">配送通知</div>
            </div>
        </div>

        <div class="notifications">
            <h3>📬 通知列表</h3>
            <div id="notificationList">
                <div class="empty">暂无通知消息</div>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let messageCount = 0;
        let counts = { payment: 0, order: 0, delivery: 0, system: 0 };

        function connect() {
            const userID = document.getElementById('userID').value;
            if (!userID) {
                alert('请输入用户ID');
                return;
            }

            const url = `ws://localhost:8080/ws/notifications?user_id=${userID}`;
            ws = new WebSocket(url);

            ws.onopen = () => {
                console.log('✅ WebSocket 已连接');
                updateStatus(true);
                document.getElementById('connectBtn').disabled = true;
                document.getElementById('disconnectBtn').disabled = false;
            };

            ws.onmessage = (event) => {
                const message = JSON.parse(event.data);
                console.log('📬 收到消息:', message);
                handleMessage(message);
            };

            ws.onclose = () => {
                console.log('❌ WebSocket 已断开');
                updateStatus(false);
                document.getElementById('connectBtn').disabled = false;
                document.getElementById('disconnectBtn').disabled = true;
            };

            ws.onerror = (error) => {
                console.error('❌ WebSocket 错误:', error);
            };

            // 请求浏览器通知权限
            if ('Notification' in window && Notification.permission === 'default') {
                Notification.requestPermission();
            }
        }

        function disconnect() {
            if (ws) {
                ws.close();
                ws = null;
            }
        }

        function updateStatus(connected) {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            
            if (connected) {
                dot.classList.add('connected');
                text.textContent = '已连接';
                text.style.color = '#2ecc71';
                text.style.fontWeight = 'bold';
            } else {
                dot.classList.remove('connected');
                text.textContent = '未连接';
                text.style.color = '#e74c3c';
                text.style.fontWeight = 'normal';
            }
        }

        function handleMessage(message) {
            messageCount++;
            if (counts[message.type] !== undefined) {
                counts[message.type]++;
            }

            updateStats();
            addNotification(message);

            // 显示浏览器通知
            if ('Notification' in window && Notification.permission === 'granted') {
                const icon = getIcon(message.type);
                new Notification(`${icon} ${message.title}`, {
                    body: message.content,
                    icon: '/logo.png'
                });
            }

            // 标记为已读
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'read',
                    message_id: message.message_id
                }));
            }
        }

        function addNotification(message) {
            const list = document.getElementById('notificationList');
            const empty = list.querySelector('.empty');
            if (empty) {
                empty.remove();
            }

            const div = document.createElement('div');
            div.className = `notification ${message.type}`;
            div.innerHTML = `
                <div class="notification-header">
                    <div class="notification-title">${getIcon(message.type)} ${message.title}</div>
                    <div class="notification-time">${formatTime(message.timestamp)}</div>
                </div>
                <div class="notification-content">${message.content}</div>
                <span class="notification-type" style="background: ${getTypeColor(message.type)}">${getTypeName(message.type)}</span>
            `;

            list.insertBefore(div, list.firstChild);
        }

        function updateStats() {
            document.getElementById('totalMessages').textContent = messageCount;
            document.getElementById('paymentCount').textContent = counts.payment;
            document.getElementById('orderCount').textContent = counts.order;
            document.getElementById('deliveryCount').textContent = counts.delivery;
        }

        function clearMessages() {
            const list = document.getElementById('notificationList');
            list.innerHTML = '<div class="empty">暂无通知消息</div>';
            messageCount = 0;
            counts = { payment: 0, order: 0, delivery: 0, system: 0 };
            updateStats();
        }

        function getIcon(type) {
            const icons = {
                payment: '💰',
                order: '📦',
                delivery: '🚚',
                system: '📢',
                refund: '💸'
            };
            return icons[type] || '📬';
        }

        function getTypeName(type) {
            const names = {
                payment: '支付通知',
                order: '订单通知',
                delivery: '配送通知',
                system: '系统通知',
                refund: '退款通知'
            };
            return names[type] || '通知';
        }

        function getTypeColor(type) {
            const colors = {
                payment: '#2ecc71',
                order: '#3498db',
                delivery: '#f39c12',
                system: '#e74c3c',
                refund: '#9b59b6'
            };
            return colors[type] || '#667eea';
        }

        function formatTime(timestamp) {
            const date = new Date(timestamp * 1000);
            return date.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
        }

        // 页面加载时自动连接
        window.onload = () => {
            // connect();
        };
    </script>
</body>
</html>
