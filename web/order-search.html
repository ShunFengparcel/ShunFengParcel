<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单搜索 - 顺丰速运</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .search-card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .search-section {
            margin-bottom: 25px;
        }

        .search-section h3 {
            font-size: 16px;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }

        .search-section h3::before {
            content: '';
            width: 4px;
            height: 16px;
            background: #667eea;
            margin-right: 8px;
            border-radius: 2px;
        }

        .quick-search {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .search-btn {
            padding: 12px 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }

        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .search-btn:active {
            transform: translateY(0);
        }

        .advanced-filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
        }

        .filter-group label {
            font-size: 13px;
            color: #666;
            margin-bottom: 6px;
        }

        .filter-group input,
        .filter-group select {
            padding: 10px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .filter-group input:focus,
        .filter-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 6px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .checkbox-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-right: 6px;
            cursor: pointer;
        }

        .checkbox-item label {
            font-size: 14px;
            color: #333;
            cursor: pointer;
        }

        .filter-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .reset-btn {
            padding: 10px 24px;
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .reset-btn:hover {
            background: #667eea;
            color: white;
        }

        .results-card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .results-info {
            font-size: 14px;
            color: #666;
        }

        .results-info strong {
            color: #667eea;
            font-size: 18px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        .order-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .order-item {
            border: 2px solid #f0f0f0;
            border-radius: 8px;
            padding: 20px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .order-item:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.1);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .order-no {
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }

        .order-status {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-signed {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .status-pending {
            background: #fff3e0;
            color: #f57c00;
        }

        .status-transit {
            background: #e3f2fd;
            color: #1976d2;
        }

        .order-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
        }

        .detail-label {
            font-size: 12px;
            color: #999;
            margin-bottom: 4px;
        }

        .detail-value {
            font-size: 14px;
            color: #333;
        }

        .order-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #f0f0f0;
        }

        .order-amount {
            font-size: 18px;
            font-weight: 600;
            color: #667eea;
        }

        .order-time {
            font-size: 12px;
            color: #999;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 30px;
        }

        .page-btn {
            padding: 8px 16px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .page-btn:hover:not(:disabled) {
            border-color: #667eea;
            color: #667eea;
        }

        .page-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .page-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .page-info {
            font-size: 14px;
            color: #666;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-state svg {
            width: 120px;
            height: 120px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .empty-state h3 {
            font-size: 18px;
            color: #666;
            margin-bottom: 10px;
        }

        .empty-state p {
            font-size: 14px;
            color: #999;
        }

        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        @media (max-width: 768px) {
            .advanced-filters {
                grid-template-columns: 1fr;
            }

            .order-details {
                grid-template-columns: 1fr;
            }

            .quick-search {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 订单搜索</h1>
            <p>快速查找您的订单信息</p>
        </div>

        <div class="search-card">
            <div class="search-section">
                <h3>快速搜索</h3>
                <div class="quick-search">
                    <input 
                        type="text" 
                        id="keyword" 
                        class="search-input" 
                        placeholder="输入订单号、手机号、姓名或地址关键词"
                    >
                    <button class="search-btn" onclick="searchOrders()">搜索</button>
                </div>
            </div>

            <div class="search-section">
                <h3>高级筛选</h3>
                <div class="advanced-filters">
                    <div class="filter-group">
                        <label>开始日期</label>
                        <input type="date" id="startDate">
                    </div>
                    <div class="filter-group">
                        <label>结束日期</label>
                        <input type="date" id="endDate">
                    </div>
                    <div class="filter-group">
                        <label>产品类型</label>
                        <select id="productType">
                            <option value="">全部</option>
                            <option value="文件">文件</option>
                            <option value="包裹">包裹</option>
                            <option value="生鲜">生鲜</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>最小金额</label>
                        <input type="number" id="minAmount" placeholder="0">
                    </div>
                    <div class="filter-group">
                        <label>最大金额</label>
                        <input type="number" id="maxAmount" placeholder="1000">
                    </div>
                </div>

                <div class="filter-group" style="margin-top: 15px;">
                    <label>订单状态</label>
                    <div class="checkbox-group">
                        <div class="checkbox-item">
                            <input type="checkbox" id="status-pending" value="PENDING">
                            <label for="status-pending">待揽收</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="status-transit" value="IN_TRANSIT">
                            <label for="status-transit">运输中</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="status-signed" value="SIGNED">
                            <label for="status-signed">已签收</label>
                        </div>
                    </div>
                </div>

                <div class="filter-actions">
                    <button class="reset-btn" onclick="resetFilters()">重置</button>
                    <button class="search-btn" onclick="searchOrders()">应用筛选</button>
                </div>
            </div>
        </div>

        <div id="errorMessage" class="error-message"></div>

        <div class="results-card">
            <div class="results-header">
                <div class="results-info">
                    找到 <strong id="totalCount">0</strong> 条订单
                    <span id="searchTime" style="margin-left: 10px; color: #999;"></span>
                </div>
            </div>

            <div id="loadingState" class="loading" style="display: none;">
                正在搜索
            </div>

            <div id="orderList" class="order-list"></div>

            <div id="emptyState" class="empty-state" style="display: none;">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                </svg>
                <h3>未找到订单</h3>
                <p>请尝试调整搜索条件</p>
            </div>

            <div id="pagination" class="pagination" style="display: none;"></div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:18000';
        let currentPage = 1;
        let totalPages = 1;

        // 页面加载时执行初始搜索
        window.onload = function() {
            searchOrders();
        };

        // 搜索订单
        async function searchOrders(page = 1) {
            currentPage = page;
            
            // 显示加载状态
            document.getElementById('loadingState').style.display = 'block';
            document.getElementById('orderList').innerHTML = '';
            document.getElementById('emptyState').style.display = 'none';
            document.getElementById('pagination').style.display = 'none';
            hideError();

            // 获取搜索条件
            const keyword = document.getElementById('keyword').value.trim();
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            const productType = document.getElementById('productType').value;
            const minAmount = parseFloat(document.getElementById('minAmount').value) || 0;
            const maxAmount = parseFloat(document.getElementById('maxAmount').value) || 0;

            // 获取选中的状态
            const statuses = [];
            document.querySelectorAll('.checkbox-item input:checked').forEach(cb => {
                statuses.push(cb.value);
            });

            // 构建请求体
            const requestBody = {
                keyword: keyword,
                start_date: startDate,
                end_date: endDate,
                status: statuses,
                product_type: productType,
                min_amount: minAmount,
                max_amount: maxAmount,
                page: page,
                page_size: 10
            };

            try {
                const response = await fetch(`${API_BASE_URL}/api/v1/orders/search`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(requestBody)
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const result = await response.json();
                
                if (result.code === 200) {
                    displayResults(result.data);
                } else {
                    showError(result.msg || '搜索失败');
                }
            } catch (error) {
                console.error('搜索错误:', error);
                showError('搜索失败，请检查网络连接或稍后重试');
            } finally {
                document.getElementById('loadingState').style.display = 'none';
            }
        }

        // 显示搜索结果
        function displayResults(data) {
            const { total, list, took } = data;
            
            // 更新统计信息
            document.getElementById('totalCount').textContent = total;
            document.getElementById('searchTime').textContent = `(耗时 ${took}ms)`;

            const orderList = document.getElementById('orderList');
            orderList.innerHTML = '';

            if (!list || list.length === 0) {
                document.getElementById('emptyState').style.display = 'block';
                return;
            }

            // 渲染订单列表
            list.forEach(order => {
                const orderItem = createOrderItem(order);
                orderList.appendChild(orderItem);
            });

            // 显示分页
            totalPages = Math.ceil(total / 10);
            if (totalPages > 1) {
                displayPagination();
            }
        }

        // 创建订单项
        function createOrderItem(order) {
            const div = document.createElement('div');
            div.className = 'order-item';
            
            const statusClass = getStatusClass(order.order_status);
            const statusText = getStatusText(order.order_status);
            
            div.innerHTML = `
                <div class="order-header">
                    <div class="order-no">订单号：${order.order_no}</div>
                    <div class="order-status ${statusClass}">${statusText}</div>
                </div>
                <div class="order-details">
                    <div class="detail-item">
                        <div class="detail-label">寄件人</div>
                        <div class="detail-value">${order.sender_name} ${order.sender_phone}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">收件人</div>
                        <div class="detail-value">${order.receiver_name} ${order.receiver_phone}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">寄件地址</div>
                        <div class="detail-value">${order.sender_address}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">收件地址</div>
                        <div class="detail-value">${order.receiver_address}</div>
                    </div>
                </div>
                <div class="order-footer">
                    <div class="order-amount">¥${order.order_amount.toFixed(2)}</div>
                    <div class="order-time">${order.created_at}</div>
                </div>
            `;
            
            return div;
        }

        // 获取状态样式类
        function getStatusClass(status) {
            const statusMap = {
                'SIGNED': 'status-signed',
                'PENDING': 'status-pending',
                'IN_TRANSIT': 'status-transit'
            };
            return statusMap[status] || 'status-pending';
        }

        // 获取状态文本
        function getStatusText(status) {
            const statusMap = {
                'SIGNED': '已签收',
                'PENDING': '待揽收',
                'IN_TRANSIT': '运输中',
                'DELIVERED': '派送中'
            };
            return statusMap[status] || status;
        }

        // 显示分页
        function displayPagination() {
            const pagination = document.getElementById('pagination');
            pagination.innerHTML = '';
            pagination.style.display = 'flex';

            // 上一页按钮
            const prevBtn = document.createElement('button');
            prevBtn.className = 'page-btn';
            prevBtn.textContent = '上一页';
            prevBtn.disabled = currentPage === 1;
            prevBtn.onclick = () => searchOrders(currentPage - 1);
            pagination.appendChild(prevBtn);

            // 页码信息
            const pageInfo = document.createElement('div');
            pageInfo.className = 'page-info';
            pageInfo.textContent = `第 ${currentPage} / ${totalPages} 页`;
            pagination.appendChild(pageInfo);

            // 下一页按钮
            const nextBtn = document.createElement('button');
            nextBtn.className = 'page-btn';
            nextBtn.textContent = '下一页';
            nextBtn.disabled = currentPage === totalPages;
            nextBtn.onclick = () => searchOrders(currentPage + 1);
            pagination.appendChild(nextBtn);
        }

        // 重置筛选条件
        function resetFilters() {
            document.getElementById('keyword').value = '';
            document.getElementById('startDate').value = '';
            document.getElementById('endDate').value = '';
            document.getElementById('productType').value = '';
            document.getElementById('minAmount').value = '';
            document.getElementById('maxAmount').value = '';
            document.querySelectorAll('.checkbox-item input').forEach(cb => {
                cb.checked = false;
            });
            searchOrders();
        }

        // 显示错误信息
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
        }

        // 隐藏错误信息
        function hideError() {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.classList.remove('show');
        }

        // 回车键搜索
        document.getElementById('keyword').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchOrders();
            }
        });
    </script>
</body>
</html>
